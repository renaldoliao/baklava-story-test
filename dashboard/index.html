<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Baklava Story Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Kalam:wght@400;700&display=swap">
<link rel="stylesheet" href="s.css"><link rel="stylesheet" href="x.css"></head><body>
<div class="wrap">
<header class="top">
<div class="mark">Baklava Story</div>
<nav class="tabs" aria-label="Views"><button data-act="tab" data-t="week" class="on">Week</button><button data-act="tab" data-t="history">History</button><button data-act="tab" data-t="products">Products</button><i class="tabbar" aria-hidden="true"></i></nav>
<div class="toplinks"><button class="nb" data-act="numbers">Week numbers</button></div>
</header>
<div class="weeknav">
<button class="nb" data-act="weekprev"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M12.5 3.5 6 10l6.5 6.5"/></svg>Last week</button>
<span class="rangebox"><b class="range num" id="range"></b><small id="rangesub"></small></span>
<button class="nb" data-act="weeknext">Next week<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M7.5 3.5 14 10l-6.5 6.5"/></svg></button>
</div>
<p class="sync" id="sync"></p>
<div id="notice" hidden></div>
<main id="view"></main>
<p class="help">Tap an order to cross it out when it is picked up. Tap a day name for that day's bake list. <button class="csv" data-act="export" data-s="week">Export CSV</button></p>
</div>
<div id="layer"></div>
<div id="pop" hidden></div>
<div id="toast" class="toast" hidden></div>

</body></html>
